name: Temporary Refresh Next Lockfile

on:
  push:
    branches:
      - codex/prompt-055-audit-management-notification-producers
    paths:
      - .github/workflows/temporary-refresh-next-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/prompt-055-audit-management-notification-producers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install next@16.3.4 eslint-config-next@16.3.4 --save-exact --package-lock-only
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Patch Next.js dependency advisory"
          git push origin HEAD:codex/prompt-055-audit-management-notification-producers
